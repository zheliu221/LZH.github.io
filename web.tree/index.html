<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HEIMAZS 园区管理系统</title>
    <link rel="stylesheet" href="Index.css">
</head>
<body>
    <!-- 左侧侧边栏 -->
    <aside class="sidebar">
        <div class="logo">
            <h1>HEIMAZS</h1>
        </div>
        <nav class="menu">
            <ul>
                <li class="menu-item">
                    <a href="index.html">
                        <span class="icon">▣</span>
                        <span class="text">工作台</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▤</span>
                        <span class="text">园区管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▥</span>
                        <span class="text">行车管理</span>
                        <span class="arrow">▾</span>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">区域管理</a></li>
                        <li><a href="monthCard.html">月卡管理</a></li>
                        <li><a href="#">停车缴费管理</a></li>
                        <li><a href="#">计费规则管理</a></li>
                    </ul>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▦</span>
                        <span class="text">物业费管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▧</span>
                        <span class="text">一体杆管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▨</span>
                        <span class="text">系统管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- 中间主内容区 -->
    <main class="main">
        <div class="header">
            <div class="breadcrumb">首页 / 工作台</div>
            <div class="user-info">
                <span class="username">黑马管理员</span>
            </div>
        </div>

        <section class="content">
            <!-- 园区数据卡片 -->
            <div class="card">
                <div class="card-header">
                    <h2>园区数据</h2>
                </div>
                <div class="card-body">
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-label">年度累计收费（元）</div>
                            <div class="stat-value" id="statIncome">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">入驻企业总数（个）</div>
                            <div class="stat-value" id="statCompany">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">月卡车辆总数（辆）</div>
                            <div class="stat-value" id="statMonthCard">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">一体杆总数（台）</div>
                            <div class="stat-value" id="statPole">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 快捷入口卡片 -->
            <div class="card">
                <div class="card-header">
                    <h2>快捷入口</h2>
                </div>
                <div class="card-body">
                    <div class="quick-grid">
                        <div class="quick-item">
                            <div class="quick-icon icon-blue">🏢</div>
                            <div class="quick-label">添加企业</div>
                        </div>
                        <div class="quick-item">
                            <div class="quick-icon icon-green">👥</div>
                            <div class="quick-label">员工管理</div>
                        </div>
                        <a class="quick-item" href="addMonthCard.html">
                            <div class="quick-icon icon-orange">📋</div>
                            <div class="quick-label">添加账单</div>
                        </a>
                        <div class="quick-item">
                            <div class="quick-icon icon-purple">📊</div>
                            <div class="quick-label">数据大屏</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 占位卡片 -->
            <div class="card">
                <div class="card-header">
                    <h2>快捷入口</h2>
                </div>
                <div class="card-body">
                    <p class="placeholder-text">暂无内容</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 右侧快捷入口区 -->
    <aside class="right-panel">
        <div class="card">
            <div class="card-header">
                <h2>快捷入口</h2>
            </div>
            <div class="card-body">
                <div class="quick-grid">
                    <div class="quick-item">
                        <div class="quick-icon icon-blue">🏢</div>
                        <div class="quick-label">添加企业</div>
                    </div>
                    <div class="quick-item">
                        <div class="quick-icon icon-green">👥</div>
                        <div class="quick-label">员工管理</div>
                    </div>
                    <a class="quick-item" href="addMonthCard.html">
                        <div class="quick-icon icon-orange">📋</div>
                        <div class="quick-label">添加账单</div>
                    </a>
                    <div class="quick-item">
                        <div class="quick-icon icon-purple">📊</div>
                        <div class="quick-label">数据大屏</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>快捷入口</h2>
            </div>
            <div class="card-body">
                <p class="placeholder-text">暂无内容</p>
            </div>
        </div>
    </aside>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script src="home.js"></script>
</body>
</html>
