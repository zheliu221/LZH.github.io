<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>月卡管理 - HEIMAZS</title>
    <link rel="stylesheet" href="Index.css">
    <link rel="stylesheet" href="MonthCard.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <h1>HEIMAZS</h1>
        </div>
        <nav class="menu">
            <ul>
                <li class="menu-item">
                    <a href="index.html">
                        <span class="icon">▣</span>
                        <span class="text">工作台</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▤</span>
                        <span class="text">园区管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▥</span>
                        <span class="text">行车管理</span>
                        <span class="arrow">▾</span>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">区域管理</a></li>
                        <li><a href="monthCard.html">月卡管理</a></li>
                        <li><a href="#">停车缴费管理</a></li>
                        <li><a href="#">计费规则管理</a></li>
                    </ul>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▦</span>
                        <span class="text">物业费管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▧</span>
                        <span class="text">一体杆管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▨</span>
                        <span class="text">系统管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <div class="breadcrumb">首页 / 行车管理 / 月卡管理</div>
            <div class="user-info">
                <span class="username">黑马管理员</span>
            </div>
        </div>

        <section class="content">
            <!-- 查询筛选区 -->
            <div class="card">
                <div class="card-body">
                    <div class="filter-bar">
                        <div class="filter-item">
                            <label>车牌号</label>
                            <input type="text" id="filterCarNumber" placeholder="请输入车牌号">
                        </div>
                        <div class="filter-item">
                            <label>状态</label>
                            <select id="filterStatus">
                                <option value="">全部</option>
                                <option value="0">可用</option>
                                <option value="1">已过期</option>
                            </select>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-primary" id="btnSearch">查询</button>
                            <button class="btn btn-default" id="btnReset">重置</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 表格区 -->
            <div class="card">
                <div class="card-header">
                    <h2>月卡列表</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" id="btnAdd">+ 添加月卡</button>
                        <button class="btn btn-danger" id="btnBatchDelete">批量删除</button>
                    </div>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="checkAll"></th>
                                <th>序号</th>
                                <th>车牌号</th>
                                <th>车主姓名</th>
                                <th>手机号</th>
                                <th>车辆品牌</th>
                                <th>卡片类型</th>
                                <th>支付金额(元)</th>
                                <th>支付方式</th>
                                <th>开始日期</th>
                                <th>结束日期</th>
                                <th>剩余有效天数</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- 渲染函数动态生成 -->
                        </tbody>
                    </table>

                    <!-- 分页 -->
                    <div class="pagination">
                        <div class="page-info">
                            共 <span id="totalRecords">0</span> 条
                        </div>
                        <div class="page-size">
                            每页
                            <select id="pageSize">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                            </select>
                            条
                        </div>
                        <div class="page-jump">
                            <button class="btn btn-page" id="btnPrev">上一页</button>
                            <span>第 <span id="currentPage">1</span> 页 / 共 <span id="totalPage">1</span> 页</span>
                            <button class="btn btn-page" id="btnNext">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 查看弹窗（只读） -->
    <div class="modal-mask" id="viewModal">
        <div class="modal">
            <div class="modal-header">
                <h3>查看月卡</h3>
                <span class="modal-close" data-close="viewModal">×</span>
            </div>
            <div class="modal-body">
                <form id="viewForm" class="form-grid">
                    <div class="form-row">
                        <div class="form-item">
                            <label>车牌号</label>
                            <input type="text" name="carNumber" readonly>
                        </div>
                        <div class="form-item">
                            <label>车主姓名</label>
                            <input type="text" name="ownerName" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>手机号</label>
                            <input type="text" name="phone" readonly>
                        </div>
                        <div class="form-item">
                            <label>车辆品牌</label>
                            <input type="text" name="carBrand" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>卡片类型</label>
                            <input type="text" name="cardType" readonly>
                        </div>
                        <div class="form-item">
                            <label>支付金额(元)</label>
                            <input type="text" name="paymentAmount" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>支付方式</label>
                            <input type="text" name="paymentMethod" readonly>
                        </div>
                        <div class="form-item">
                            <label>剩余有效天数</label>
                            <input type="text" name="remainDay" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>开始日期</label>
                            <input type="text" name="startDate" readonly>
                        </div>
                        <div class="form-item">
                            <label>结束日期</label>
                            <input type="text" name="endDate" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>状态</label>
                            <input type="text" name="status" readonly>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-close="viewModal">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑/续费弹窗（复用同一表单） -->
    <div class="modal-mask" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="editModalTitle">编辑月卡</h3>
                <span class="modal-close" data-close="editModal">×</span>
            </div>
            <div class="modal-body">
                <form id="editForm" class="form-grid">
                    <div class="form-row">
                        <div class="form-item">
                            <label>车牌号</label>
                            <input type="text" name="carNumber">
                        </div>
                        <div class="form-item">
                            <label>车主姓名</label>
                            <input type="text" name="ownerName">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>手机号</label>
                            <input type="text" name="phone">
                        </div>
                        <div class="form-item">
                            <label>车辆品牌</label>
                            <input type="text" name="carBrand">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>卡片类型</label>
                            <input type="text" name="cardType">
                        </div>
                        <div class="form-item">
                            <label>支付金额(元)</label>
                            <input type="number" name="paymentAmount" min="0" step="0.01">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>支付方式</label>
                            <select name="paymentMethod">
                                <option value="微信">微信</option>
                                <option value="支付宝">支付宝</option>
                                <option value="银行卡">银行卡</option>
                                <option value="现金">现金</option>
                            </select>
                        </div>
                        <div class="form-item">
                            <label>剩余有效天数</label>
                            <input type="number" name="remainDay">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>开始日期</label>
                            <input type="date" name="startDate">
                        </div>
                        <div class="form-item">
                            <label>结束日期</label>
                            <input type="date" name="endDate">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label>状态</label>
                            <select name="status">
                                <option value="0">可用</option>
                                <option value="1">已过期</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" data-close="editModal">取消</button>
                <button class="btn btn-primary" id="btnSaveEdit">保存</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script src="monthCard.js"></script>
</body>
</html>
