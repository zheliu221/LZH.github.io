<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加月卡 - HEIMAZS</title>
    <link rel="stylesheet" href="Index.css">
    <link rel="stylesheet" href="MonthCard.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <h1>HEIMAZS</h1>
        </div>
        <nav class="menu">
            <ul>
                <li class="menu-item">
                    <a href="index.html">
                        <span class="icon">▣</span>
                        <span class="text">工作台</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▤</span>
                        <span class="text">园区管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▥</span>
                        <span class="text">行车管理</span>
                        <span class="arrow">▾</span>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">区域管理</a></li>
                        <li><a href="monthCard.html">月卡管理</a></li>
                        <li><a href="#">停车缴费管理</a></li>
                        <li><a href="#">计费规则管理</a></li>
                    </ul>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▦</span>
                        <span class="text">物业费管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▧</span>
                        <span class="text">一体杆管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
                <li class="menu-item has-sub">
                    <a href="#">
                        <span class="icon">▨</span>
                        <span class="text">系统管理</span>
                        <span class="arrow">▾</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main">
        <div class="header">
            <div class="breadcrumb">首页 / 行车管理 / 月卡管理 / <span id="pageTitle">添加月卡</span></div>
            <div class="user-info">
                <span class="username">黑马管理员</span>
            </div>
        </div>

        <section class="content">
            <!-- 返回按钮 -->
            <div class="page-toolbar">
                <button class="btn btn-default" id="btnBack">← 返回</button>
            </div>

            <form id="cardForm" class="form-grid">
                <!-- 车辆信息表单卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h2>车辆信息</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-item">
                                <label>车牌号 <em>*</em></label>
                                <input type="text" name="carNumber" placeholder="如：京A12345">
                                <div class="error-tip" data-error="carNumber"></div>
                            </div>
                            <div class="form-item">
                                <label>车主姓名 <em>*</em></label>
                                <input type="text" name="ownerName" placeholder="请输入车主姓名">
                                <div class="error-tip" data-error="ownerName"></div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>手机号 <em>*</em></label>
                                <input type="text" name="phone" placeholder="请输入 11 位手机号">
                                <div class="error-tip" data-error="phone"></div>
                            </div>
                            <div class="form-item">
                                <label>车辆品牌</label>
                                <input type="text" name="carBrand" placeholder="如：丰田">
                                <div class="error-tip" data-error="carBrand"></div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>卡片类型</label>
                                <input type="text" name="cardType" placeholder="如：月卡/季卡">
                                <div class="error-tip" data-error="cardType"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 缴费信息表单卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h2>缴费信息</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-item">
                                <label>支付金额(元) <em>*</em></label>
                                <input type="number" name="paymentAmount" min="0" step="0.01" placeholder="请输入支付金额">
                                <div class="error-tip" data-error="paymentAmount"></div>
                            </div>
                            <div class="form-item">
                                <label>支付方式 <em>*</em></label>
                                <select name="paymentMethod">
                                    <option value="">请选择</option>
                                    <option value="微信">微信</option>
                                    <option value="支付宝">支付宝</option>
                                    <option value="银行卡">银行卡</option>
                                    <option value="现金">现金</option>
                                </select>
                                <div class="error-tip" data-error="paymentMethod"></div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>开始日期 <em>*</em></label>
                                <input type="date" name="startDate">
                                <div class="error-tip" data-error="startDate"></div>
                            </div>
                            <div class="form-item">
                                <label>结束日期 <em>*</em></label>
                                <input type="date" name="endDate">
                                <div class="error-tip" data-error="endDate"></div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label>剩余有效天数</label>
                                <input type="number" name="remainDay" readonly placeholder="根据结束日期自动计算">
                            </div>
                            <div class="form-item">
                                <label>状态</label>
                                <input type="text" name="status" readonly placeholder="根据结束日期自动判断">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="form-actions">
                    <button type="button" class="btn btn-default" id="btnReset">重置</button>
                    <button type="button" class="btn btn-primary" id="btnSave">确定</button>
                </div>
            </form>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script src="addMonthCard.js"></script>
</body>
</html>
